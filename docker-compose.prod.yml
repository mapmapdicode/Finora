version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wealthos_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wealthos_frontend
    restart: always
    ports:
      - "4205:80"
    depends_on:
      - backend
