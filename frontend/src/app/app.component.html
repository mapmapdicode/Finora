<div class="app-shell min-h-screen text-[var(--text-main)]">
  <!-- Top App Header (Clean Slate 64px) -->
  <header class="app-topbar">
    <div class="flex items-center gap-2 sm:gap-3">
      <button 
        *ngIf="isAuthenticated"
        type="button" 
        (click)="toggleSidebar()"
        class="app-icon-button md:hidden"
        aria-label="Toggle navigation menu"
      >
        <app-icon name="menu"></app-icon>
      </button>

      <div class="flex items-center gap-2 sm:gap-3">
        <img
          src="assets/branding/wealthos-logo-01-ascending-w.png"
          alt="WealthOS Logo"
          class="h-9 w-auto object-contain shrink-0 filter drop-shadow-sm"
        />
        <div class="brand-copy">
          <div class="flex items-center gap-1.5 sm:gap-2">
            <span class="brand-name">WealthOS</span>
            <span class="brand-caption">PERSONAL WEALTH</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Quick Search & Workspace Selector -->
    <div class="app-topbar__tools">
      <!-- Search Box (Desktop) -->
      <div *ngIf="isAuthenticated" class="workspace-select">
        <span class="status-dot"></span>
        <app-icon name="search" class="text-[var(--text-muted)] text-sm mr-2"></app-icon>
        <input 
          type="text" 
          placeholder="Search workspace..."
          class="bg-transparent text-xs w-36 lg:w-52 focus:outline-none text-[var(--text-main)] font-medium"
        />
      </div>

      <!-- Workspace Switcher Dropdown -->
      <div class="flex items-center gap-2" *ngIf="isAuthenticated">
        <div class="bg-[var(--bg-subtle)] border border-[var(--border-strong)] rounded-xl px-2 sm:px-3 py-1 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
          <select
            id="workspace-select"
            class="bg-transparent text-[var(--text-main)] text-[11px] sm:text-xs font-semibold focus:outline-none cursor-pointer max-w-[110px] sm:max-w-none truncate"
            [value]="selectedWorkspaceId || ''"
            (change)="onWorkspaceChange($event)"
          >
            <option value="">-- Workspace --</option>
            <option *ngFor="let item of workspaces" [value]="item.id">
              {{ item.name }} ({{ item.baseCurrency }})
            </option>
          </select>
        </div>
      </div>

      <!-- Language Switcher Selector -->
      <div class="language-select">
        <app-icon name="language" class="text-xs text-[var(--accent-primary)]"></app-icon>
        <select
          class="bg-transparent text-[11px] sm:text-xs font-bold text-[var(--text-main)] focus:outline-none cursor-pointer"
          [value]="langService.currentLanguage"
          (change)="changeLanguage($event)"
        >
          <option value="vi">🇻🇳 VI</option>
          <option value="en">🇺🇸 EN</option>
        </select>
      </div>

      <!-- Amount Display Mode Toggle Button -->
      <button
        *ngIf="isAuthenticated"
        type="button"
        (click)="toggleAmountDisplayMode()"
        class="bg-[var(--bg-subtle)] border border-[var(--border-strong)] rounded-xl px-2.5 py-1 text-xs font-bold flex items-center gap-1.5 hover:bg-black/10 transition-colors cursor-pointer"
        [title]="'Chế độ số tiền: ' + (amountDisplayMode === 'compact' ? 'Viết tắt (100)' : 'Đầy đủ (100.000 VND)')"
      >
        <app-icon name="tune" class="text-xs text-[var(--accent-primary)]"></app-icon>
        <span class="text-[11px] font-semibold">
          {{ amountDisplayMode === 'compact' ? 'Rút gọn (100)' : 'Đầy đủ' }}
        </span>
      </button>


      <!-- Dark Mode & Logout -->
      <div class="flex items-center gap-1.5" *ngIf="isAuthenticated">
        <button
          type="button"
          (click)="toggleDarkMode()"
          class="app-icon-button hidden sm:inline-flex"
          [title]="isDarkMode ? 'Light Mode' : 'Dark Mode'"
        >
          <app-icon [name]="isDarkMode ? 'light_mode' : 'dark_mode'" class="text-[var(--text-muted)]"></app-icon>
        </button>

        <button
          (click)="logout()"
          class="avatar-button"
        >
          <app-icon name="logout" class="text-xs sm:text-sm"></app-icon>
          <span class="hidden">{{ 'common.logout' | translate }}</span><span>TH</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Backdrop Overlay when Drawer is Open -->
  <div 
    *ngIf="isAuthenticated && sidebarOpen" 
    (click)="toggleSidebar()" 
    class="app-backdrop md:hidden"
  ></div>

  <!-- Body Layout (Left Sidebar + Main Content) -->
  <div class="app-body">
    <!-- Navigation Sidebar (Drawer on Mobile, Column on Desktop) -->
    <aside 
      *ngIf="isAuthenticated"
      [class.w-60]="sidebarOpen"
      [class.w-16]="!sidebarOpen"
      [class.translate-x-0]="sidebarOpen"
      [class.-translate-x-full]="!sidebarOpen"
      class="app-sidebar"
    >
      <div class="sidebar-scroll">
        <!-- Main Navigation Section -->
        <div>
          <p *ngIf="sidebarOpen" class="sidebar-label">Tổng quan</p>
          <nav class="space-y-1">
            <a
              *ngFor="let item of navItems.slice(0, 9)"
              [routerLink]="item.path"
              routerLinkActive="bg-[#460f79] text-white font-bold shadow-md"
              class="sidebar-link"
              [title]="item.labelKey | translate"
            >
              <app-icon [name]="item.icon" class="text-base sm:text-lg"></app-icon>
              <span>{{ item.labelKey | translate }}</span>
            </a>
          </nav>
        </div>

        <!-- Automation & Tools Section -->
        <div>
          <p *ngIf="sidebarOpen" class="sidebar-label sidebar-label--tools">Công cụ</p>
          <nav class="space-y-1">
            <a
              *ngFor="let item of navItems.slice(9)"
              [routerLink]="item.path"
              routerLinkActive="bg-[#460f79] text-white font-bold shadow-md"
              class="sidebar-link"
              [title]="item.labelKey | translate"
            >
              <app-icon [name]="item.icon" class="text-base sm:text-lg"></app-icon>
              <span>{{ item.labelKey | translate }}</span>
            </a>
          </nav>
        </div>
      </div>

      <!-- Bottom Workspace Status Footer -->
      <div *ngIf="sidebarOpen" class="sidebar-footer">
        <div class="flex items-center justify-between font-bold text-[var(--text-main)]">
          <span>WealthOS Mobile</span>
          <span class="status-dot"></span>
        </div>
          <p class="sidebar-footer__version">v2.4.0 · Secure ledger</p>
      </div>
    </aside>

    <!-- Main Workspace Content Area (Mobile Responsive Full Width) -->
    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Mobile Bottom App Bar (Sticky Bottom Navigation for Phone View) -->
  <div *ngIf="isAuthenticated" class="mobile-nav">
    <a
      routerLink="/dashboard"
      routerLinkActive="text-[#460f79] font-bold"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex flex-col items-center gap-1"
    >
      <app-icon name="home" class="text-xl"></app-icon>
      <span class="text-[10px] tracking-tight">Home</span>
    </a>

    <a
      routerLink="/transactions"
      routerLinkActive="text-[#460f79] font-bold"
      class="flex flex-col items-center gap-1"
    >
      <app-icon name="swap_horiz" class="text-xl"></app-icon>
      <span class="text-[10px] tracking-tight">Transactions</span>
    </a>

    <a
      routerLink="/portfolios"
      routerLinkActive="text-[#460f79] font-bold"
      class="flex flex-col items-center gap-1"
    >
      <app-icon name="pie_chart" class="text-xl"></app-icon>
      <span class="text-[10px] tracking-tight">Wealth</span>
    </a>

    <button
      (click)="toggleSidebar()"
      class="flex flex-col items-center gap-1"
    >
      <app-icon name="menu" class="text-xl"></app-icon>
      <span class="text-[10px] tracking-tight">Menu</span>
    </button>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-stack">
    <article
      *ngFor="let toast of toasts$ | async"
      [ngClass]="[
        'toast-message',
        toastClass(toast.type)
      ]"
    >
      <div class="flex items-start gap-2.5">
        <app-icon [name]="toast.type === 'success' ? 'check_circle' : toast.type === 'error' ? 'error' : 'info'" class="text-base mt-0.5"></app-icon>
        <p>{{ toast.message }}</p>
      </div>
      <button
        type="button"
        class="text-xs opacity-60 hover:opacity-100 p-1 rounded hover:bg-black/5"
        (click)="closeToast(toast.id)"
        aria-label="Dismiss alert"
      >
        <app-icon name="close" class="text-sm"></app-icon>
      </button>
    </article>
  </div>
</div>
