<div class="min-h-screen bg-slate-100 text-slate-900">
  <header class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
    <h1 class="text-xl font-semibold">WealthOS</h1>
    <div class="flex items-center gap-3" *ngIf="isAuthenticated">
      <label for="workspace-select" class="text-xs text-slate-200">Workspace</label>
      <select
        id="workspace-select"
        class="rounded-lg border border-slate-300 bg-slate-800 text-white px-2 py-1 text-sm"
        [value]="selectedWorkspaceId || ''"
        (change)="onWorkspaceChange($event)"
      >
        <option value="">-- Select workspace --</option>
        <option *ngFor="let item of workspaces" [value]="item.id">
          {{ item.name }} ({{ item.baseCurrency }})
        </option>
      </select>
    </div>
    <button
      *ngIf="isAuthenticated"
      (click)="logout()"
      class="text-xs rounded-lg border border-slate-300/30 px-3 py-1.5 hover:bg-slate-700"
    >
      Logout
    </button>
  </header>

  <nav class="px-4 py-3 bg-white border-b border-slate-200" *ngIf="isAuthenticated">
    <ul class="flex flex-wrap gap-4">
      <li *ngFor="let item of navItems">
        <a
          [routerLink]="item.path"
          routerLinkActive="text-indigo-700"
          class="text-sm font-medium text-slate-600 hover:text-slate-900"
        >
          {{ item.label }}
        </a>
      </li>
    </ul>
  </nav>

  <main class="p-4">
    <router-outlet></router-outlet>
  </main>

  <div class="pointer-events-none fixed top-4 right-4 z-50 flex flex-col gap-2 w-[min(92vw,24rem)]">
    <article
      *ngFor="let toast of toasts$ | async"
      [ngClass]="[
        'pointer-events-auto rounded-lg border px-4 py-3 text-sm shadow-lg backdrop-blur',
        toastClass(toast.type)
      ]"
    >
      <div class="flex items-start justify-between gap-3">
        <p class="leading-relaxed">{{ toast.message }}</p>
        <button
          type="button"
          class="text-xs opacity-70 hover:opacity-100"
          (click)="closeToast(toast.id)"
          aria-label="Dismiss alert"
        >
          &times;
        </button>
      </div>
    </article>
  </div>
</div>
