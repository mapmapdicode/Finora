<div class="app-shell min-h-screen text-[#261432] relative flex justify-center bg-[#fff7fc] font-sans">
  <div *ngIf="isAuthenticated" aria-hidden="true" class="fixed inset-0 z-0 bg-cover bg-center bg-no-repeat pointer-events-none"
       style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAuv1VBAVXQw2bzmZKIeus0GWAWdK9Xq8RAqpB6InckJ-MkZjH27I4lpMz-awnzb0u65rypAJ2t01Gm4toO3w2bihSRPh2A79QLe-LWMi61-2yNwSSjBilOXds8w_Oa0MRkugpZ9K1cwjEFRZ-hkuqU0YyKII_8PG3d707KbDtUcevM3S3wCFxc8xR9iUBdSKLH-ehioxk7Z8s5XP5oXvsyHSvYI3z9avCQL-nzoJdi2-p1JXHOKoLE');">
    <div class="absolute inset-0 bg-white/40 backdrop-blur-[2px]"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-white/70 via-purple-50/20 to-white/85"></div>
  </div>

  <div [class.mobile-app-frame]="isAuthenticated"
       class="app-viewport min-h-screen relative z-10 flex flex-col bg-[#fff7fc]/90 backdrop-blur-2xl border-x border-[#cfc2d2]/30 shadow-[0_20px_60px_rgba(43,1,77,0.06)]">
    <header *ngIf="isAuthenticated && !isPublicRoute" class="w-full sticky top-0 z-40 px-5 py-3.5 bg-[#fff7fc]/95 backdrop-blur-md border-b border-[#cfc2d2]/30">
      <div class="flex items-center justify-between gap-3">
        <div (click)="goHome()" class="flex min-w-0 items-center gap-3 cursor-pointer group hover:opacity-90 transition-all" title="Về trang chủ Finora" role="button" tabindex="0">
          <span class="w-8 h-8 shrink-0 rounded-xl bg-gradient-to-r from-[#43016a] to-[#5b2382] text-white font-extrabold flex items-center justify-center text-sm shadow-sm group-hover:scale-105 transition-transform">F</span>
          <div class="min-w-0"><span class="block text-xl font-bold text-[#43016a] tracking-tight font-display group-hover:text-[#5b2382]">Finora</span><span class="block truncate text-[10px] font-semibold text-[#795b8a]">Tài chính của bạn, trong một nơi</span></div>
        </div>
        <div class="flex items-center gap-2">
          <button *ngIf="showBackButton" type="button" class="app-back-button" (click)="goBack()" aria-label="Quay lại trang trước">
            <span class="material-symbols-outlined text-lg">arrow_back</span><span>Quay lại</span>
          </button>
          <button 
            type="button" 
            (click)="logout()" 
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-rose-200 bg-white text-xs font-bold text-rose-700 hover:bg-rose-50 hover:border-rose-300 transition-colors shadow-xs" 
            title="Đăng xuất khỏi ứng dụng"
            aria-label="Đăng xuất"
          >
            <span class="material-symbols-outlined text-base">logout</span>
            <span class="hidden sm:inline">Đăng xuất</span>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 w-full min-w-0">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 w-full max-w-[440px] px-4 pointer-events-none space-y-2">
    <article *ngFor="let toast of toasts$ | async" [attr.role]="toastRole(toast.type)"
             class="pointer-events-auto flex items-center justify-between gap-3 p-3.5 rounded-2xl bg-white border border-[#cfc2d2]/40 shadow-xl text-xs font-semibold text-[#261432] animate-fade">
      <div class="flex items-center gap-2.5"><span class="material-symbols-outlined text-lg" [ngClass]="toast.type === 'success' ? 'text-emerald-600' : toast.type === 'error' ? 'text-rose-600' : 'text-[#43016a]'">{{ toast.type === 'success' ? 'check_circle' : toast.type === 'error' ? 'error' : 'info' }}</span><span>{{ toast.message }}</span></div>
      <button type="button" (click)="closeToast(toast.id)" class="text-[#7e7481] hover:text-[#261432]"><span class="material-symbols-outlined text-sm">close</span></button>
    </article>
  </div>
</div>
