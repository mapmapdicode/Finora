<section class="max-w-md mx-auto my-16">
  <div class="m3-card p-8 shadow-md">
    <div class="text-center mb-6">
      <div class="brand-mark mx-auto mb-3" aria-hidden="true">F</div>
      <h2 class="text-2xl font-bold text-[var(--text-main)] tracking-tight">Tạo tài khoản Finora</h2>
      <p class="text-xs text-[var(--text-muted)] mt-1">Thiết lập không gian quản lý tài chính của bạn</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4" *ngIf="!verificationRequired; else verification">
      <div>
        <label class="m3-label block mb-1" for="register-name">Họ và tên</label>
        <input id="register-name" formControlName="name" class="m3-input" autocomplete="name" placeholder="Ví dụ: Nguyễn An" />
      </div>

      <div>
        <label class="m3-label block mb-1" for="register-confirm-password">Nhập lại mật khẩu</label>
        <input id="register-confirm-password" formControlName="confirmPassword" type="password" class="m3-input" autocomplete="new-password" placeholder="Nhập lại mật khẩu" />
      </div>

      <div>
        <label class="m3-label block mb-1" for="register-email">Địa chỉ email</label>
        <input id="register-email" formControlName="email" class="m3-input" type="email" autocomplete="email" placeholder="email@example.com" />
      </div>

      <div>
        <label class="m3-label block mb-1" for="register-password">Mật khẩu</label>
        <input id="register-password" formControlName="password" type="password" class="m3-input" autocomplete="new-password" placeholder="Tạo mật khẩu" />
      </div>

      <button type="submit" class="m3-btn m3-btn-primary w-full py-2.5 mt-2" [disabled]="submitting">
        <app-icon name="person_add"></app-icon> Tạo tài khoản
      </button>
    </form>

    <ng-template #verification>
      <form [formGroup]="form" (ngSubmit)="verifyEmail()" class="space-y-4">
        <div><label class="m3-label block mb-1" for="register-verification-code">Mã xác thực gồm 6 chữ số</label><input id="register-verification-code" formControlName="code" class="m3-input tracking-[.35em] text-center" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" /></div>
        <button type="submit" class="m3-btn m3-btn-primary w-full py-2.5" [disabled]="submitting"><app-icon name="verified"></app-icon> Hoàn tất xác thực</button>
        <button type="button" (click)="resendCode()" class="w-btn w-btn-ghost w-full">Gửi lại mã</button>
      </form>
    </ng-template>

    <p *ngIf="message" role="alert" aria-live="assertive" class="text-xs text-[var(--m3-danger)] bg-[var(--m3-danger-container)] p-3 rounded-xl mt-4 text-center">
      {{ message }}
    </p>

    <div class="mt-6 pt-4 border-t border-[var(--m3-outline)] text-center">
      <p class="text-xs text-[var(--text-muted)]">
        Đã có tài khoản?
        <a class="text-[var(--m3-primary)] font-semibold hover:underline ml-1" routerLink="/login">Đăng nhập</a>
      </p>
    </div>
  </div>
</section>
