<section class="max-w-md mx-auto my-16">
  <div class="m3-card p-8 shadow-md">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-[var(--m3-primary)] text-white flex items-center justify-center font-bold text-2xl mx-auto shadow-md mb-3">
        W
      </div>
      <h2 class="text-2xl font-bold text-[var(--m3-on-surface)] tracking-tight">Create Workspace</h2>
      <p class="text-xs text-[var(--m3-on-surface-variant)] mt-1">Register user account and initial workspace container</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="m3-label block mb-1">Full Name</label>
        <input formControlName="name" class="m3-input" placeholder="e.g. John Doe" />
      </div>

      <div>
        <label class="m3-label block mb-1">Email Address</label>
        <input formControlName="email" class="m3-input" placeholder="e.g. john@example.com" />
      </div>

      <div>
        <label class="m3-label block mb-1">Password</label>
        <input formControlName="password" type="password" class="m3-input" placeholder="Create password" />
      </div>

      <div>
        <label class="m3-label block mb-1">Workspace Name</label>
        <input formControlName="workspaceName" class="m3-input" placeholder="e.g. Household Finance" />
      </div>

      <button class="m3-btn m3-btn-primary w-full py-2.5 mt-2">
        <span class="material-symbols-rounded">person_add</span> Register Account
      </button>
    </form>

    <p *ngIf="message" class="text-xs text-[var(--m3-danger)] bg-[var(--m3-danger-container)] p-3 rounded-xl mt-4 text-center">
      {{ message }}
    </p>

    <div class="mt-6 pt-4 border-t border-[var(--m3-outline)] text-center">
      <p class="text-xs text-[var(--m3-on-surface-variant)]">
        Already have an account?
        <a class="text-[var(--m3-primary)] font-semibold hover:underline ml-1" routerLink="/login">Sign in</a>
      </p>
    </div>
  </div>
</section>
