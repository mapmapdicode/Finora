<section class="max-w-md mx-auto my-16">
  <div class="m3-card p-8 shadow-md">
    <div class="text-center mb-6">
      <div class="brand-mark mx-auto mb-3" aria-hidden="true">F</div>
      <h2 class="text-2xl font-bold text-[var(--text-main)] tracking-tight">Chào mừng trở lại</h2>
      <p class="text-xs text-[var(--text-muted)] mt-1">Đăng nhập để quản lý tài chính của bạn</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="m3-label block mb-1" for="login-email">Email / Tên đăng nhập</label>
        <input id="login-email" formControlName="email" class="m3-input" autocomplete="username" placeholder="email@example.com" />
      </div>

      <div>
        <label class="m3-label block mb-1" for="login-password">Mật khẩu</label>
        <input id="login-password" formControlName="password" type="password" class="m3-input" autocomplete="current-password" placeholder="Nhập mật khẩu" />
      </div>

      <button type="submit" class="m3-btn m3-btn-primary w-full py-2.5 mt-2">
        <app-icon name="login"></app-icon> Đăng nhập
      </button>
    </form>

    <p *ngIf="message" role="alert" aria-live="assertive" class="text-xs text-[var(--m3-danger)] bg-[var(--m3-danger-container)] p-3 rounded-xl mt-4 text-center">
      {{ message }}
    </p>

    <div class="mt-6 pt-4 border-t border-[var(--m3-outline)] text-center">
      <p class="text-xs text-[var(--text-muted)]">
        Chưa có tài khoản?
        <a class="text-[var(--m3-primary)] font-semibold hover:underline ml-1" routerLink="/register">Tạo không gian mới</a>
      </p>
    </div>
  </div>
</section>
