<section class="space-y-5">
  <h2 class="text-2xl font-semibold">Properties</h2>

  <p class="rounded border border-amber-200 bg-amber-50 p-3 text-sm text-amber-700" *ngIf="!auth.canMutate">
    This workspace is read-only. You can only view properties.
  </p>

  <form
    (ngSubmit)="submitProperty()"
    [formGroup]="propertyForm"
    class="grid md:grid-cols-2 gap-3 bg-white p-4 rounded-lg border"
  >
    <input formControlName="name" placeholder="Property name" class="border p-2 rounded" />
    <input formControlName="address" placeholder="Address" class="border p-2 rounded" />
    <input
      formControlName="areaM2"
      placeholder="Area (m2)"
      class="border p-2 rounded md:col-span-2"
    />
    <input
      formControlName="portfolioId"
      placeholder="Portfolio ID (optional)"
      class="border p-2 rounded md:col-span-2"
    />
    <button class="bg-blue-600 text-white rounded px-4 py-2 md:col-span-2" [disabled]="!auth.canMutate">
      Create property
    </button>
  </form>

  <p class="text-sm text-red-600">{{ statusMessage }}</p>

  <div class="bg-white border rounded-lg">
    <div class="px-4 py-2 border-b font-semibold">List</div>
    <ul class="divide-y">
      <li *ngFor="let item of properties" class="px-4 py-2">
        <div class="flex items-start justify-between gap-4">
          <div>
            <p class="font-semibold">{{ item.name }}</p>
            <p class="text-sm text-slate-600">{{ item.address }} · {{ item.areaM2 }} m²</p>
          </div>
          <button
            *ngIf="auth.canMutate"
            type="button"
            class="text-xs px-3 py-1 rounded border"
            (click)="openValuation(item.id)"
          >
            Add valuation
          </button>
        </div>
      </li>
      <li *ngIf="properties.length === 0" class="px-4 py-3 text-slate-500">No properties yet.</li>
    </ul>
  </div>

  <div *ngIf="selectedPropertyId" class="bg-white p-4 border rounded-lg space-y-2">
    <h4 class="font-semibold">Valuation for: {{ selectedPropertyId }}</h4>
    <form [formGroup]="valuationForm" (ngSubmit)="submitValuation()" class="grid md:grid-cols-2 gap-2">
      <input formControlName="valuationAmount" placeholder="Value" class="border p-2 rounded" />
      <input formControlName="currency" placeholder="VND" class="border p-2 rounded" />
      <input formControlName="source" placeholder="Source" class="border p-2 rounded md:col-span-2" />
      <input formControlName="effectiveAt" type="datetime-local" class="border p-2 rounded md:col-span-2" />
      <div class="md:col-span-2 flex gap-2">
        <button
          type="submit"
          class="bg-emerald-700 text-white px-4 py-2 rounded"
          [disabled]="!auth.canMutate"
        >
          Save valuation
        </button>
        <button type="button" class="bg-slate-200 px-4 py-2 rounded" (click)="closeValuation()">Close</button>
      </div>
    </form>
  </div>
</section>
