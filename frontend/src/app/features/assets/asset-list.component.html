<section class="space-y-5">
  <h2 class="text-2xl font-semibold">Assets</h2>

  <p class="rounded border border-amber-200 bg-amber-50 p-3 text-sm text-amber-700" *ngIf="!auth.canMutate">
    This workspace is read-only. You can only view assets.
  </p>

  <form (ngSubmit)="submitAsset()" [formGroup]="assetForm" class="grid md:grid-cols-3 gap-3 bg-white p-4 rounded-lg border">
    <input formControlName="name" placeholder="Asset name" class="border p-2 rounded" />
    <input formControlName="assetType" placeholder="investment / fixed_income / crypto..." class="border p-2 rounded" />
    <input formControlName="portfolioId" placeholder="Portfolio ID (optional)" class="border p-2 rounded" />
    <button class="bg-blue-600 text-white rounded px-4 py-2 md:col-span-3" [disabled]="!auth.canMutate">
      Create asset
    </button>
  </form>

  <p class="text-sm text-slate-600">{{ statusMessage }}</p>

  <div class="bg-white border rounded-lg">
    <div class="px-4 py-2 border-b font-semibold">List</div>
    <ul class="divide-y">
      <li *ngFor="let item of assets" class="px-4 py-2">
        <div class="flex items-start justify-between gap-4">
          <div>
            <p class="font-semibold">{{ item.name }}</p>
            <p class="text-sm text-slate-600">Type: {{ item.assetType }}</p>
          </div>
          <button
            *ngIf="auth.canMutate"
            type="button"
            class="text-xs px-3 py-1 rounded border"
            (click)="openValuation(item.id)"
          >
            Add valuation
          </button>
        </div>
      </li>
      <li *ngIf="!assets.length" class="px-4 py-3 text-slate-500">No assets.</li>
    </ul>
  </div>

  <div *ngIf="selectedAssetId" class="bg-white p-4 border rounded-lg space-y-2">
    <h4 class="font-semibold">Valuation for: {{ selectedAssetId }}</h4>
    <form [formGroup]="valuationForm" (ngSubmit)="submitValuation()" class="grid md:grid-cols-2 gap-2">
      <input formControlName="valuationAmount" placeholder="Value" class="border p-2 rounded" />
      <input formControlName="currency" placeholder="VND" class="border p-2 rounded" />
      <input formControlName="source" placeholder="Source" class="border p-2 rounded md:col-span-2" />
      <input formControlName="effectiveAt" type="datetime-local" class="border p-2 rounded md:col-span-2" />
      <div class="md:col-span-2 flex gap-2">
        <button
          type="submit"
          class="bg-emerald-700 text-white px-4 py-2 rounded"
          [disabled]="!auth.canMutate"
        >
          Save valuation
        </button>
        <button type="button" class="bg-slate-200 px-4 py-2 rounded" (click)="closeValuation()">Close</button>
      </div>
    </form>
  </div>
</section>
