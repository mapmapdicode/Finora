<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-lg mx-auto px-5 py-6 flex flex-col gap-6 pb-32 font-sans text-[#261432]">
  <header class="w-page-heading">
    <div><p class="w-page-eyebrow">NẠP TIỀN</p><h1>Nạp tiền vào ví</h1><p>Ghi nhận nguồn tiền và tài khoản nhận một cách rõ ràng.</p></div>
  </header>
  <!-- Amount Input Section -->
  <section class="flex flex-col items-center justify-center py-4">
    <p class="text-xs font-bold text-[#4c4450] uppercase tracking-widest">SỐ TIỀN NẠP</p>
    <div class="flex items-baseline justify-center gap-2 mt-2 w-full">
      <span class="text-4xl font-bold text-[#e9c349]">₫</span>
      <input type="text"
             [value]="formattedAmount" 
             (input)="onAmountInput($event)" 
             class="bg-transparent border-none outline-none p-0 text-center text-3xl sm:text-4xl font-bold text-[#261432] w-full max-w-[280px] placeholder:text-[#cfc2d2] focus:ring-0" 
             placeholder="0" />
    </div>
    <p class="text-xs text-[#4c4450] mt-4 font-medium">Phí giao dịch: <span class="text-emerald-600 font-bold">Miễn phí</span></p>
  </section>

  <!-- Quick Amount Chips -->
  <section class="flex flex-wrap gap-2.5 justify-center">
    <button type="button" 
            *ngFor="let chip of quickChips" 
            (click)="selectChip(chip)" 
            [class.border-[#43016a]]="amount === chip" 
            [class.bg-[#fae8ff]]="amount === chip" 
            [class.text-[#43016a]]="amount === chip" 
            class="px-4 py-2 rounded-full border border-[#cfc2d2]/60 bg-white text-sm font-semibold text-[#261432] hover:bg-[#fae8ff] transition-all shadow-xs active:scale-95">
      {{ formatNumber(chip) }}
    </button>
  </section>

  <!-- Destination account: always show it so manual deposits have a clear target. -->
  <section class="flex flex-col gap-2">
    <h2 class="text-xs font-bold text-[#4c4450] uppercase tracking-widest mb-1">VÍ NHẬN TIỀN</h2>
    <div class="bg-white rounded-xl p-3 shadow-xs border border-[#cfc2d2]/40">
      <select [ngModel]="selectedAccountId" (ngModelChange)="selectedAccountId = $event" class="w-select" [disabled]="!accounts.length">
        <option *ngIf="!accounts.length" value="">Chưa có tài khoản để nhận tiền</option>
        <option *ngFor="let acc of accounts" [value]="acc.id">{{ acc.name }} ({{ acc.currency }})</option>
      </select>
    </div>
  </section>

  <p class="rounded-xl border border-[#eadfec] bg-[#fff7fc] px-4 py-3 text-center text-xs font-medium text-[#4c4450]">
    Khoản nạp sẽ được ghi nhận thủ công vào ví nhận tiền ở trên.
  </p>
</main>

<!-- Fixed Bottom Action Button -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white p-4 shadow-[0px_-12px_40px_rgba(29,11,41,0.08)] border-t border-[#cfc2d2]/30 z-40">
  <div class="w-full max-w-lg mx-auto flex gap-4">
    <button type="button" 
            (click)="submitDeposit()" 
            [disabled]="isSubmitting || amount <= 0 || !selectedAccountId"
            class="w-full bg-[#43016a] text-white font-semibold text-base py-3.5 rounded-xl hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_8px_16px_rgba(67,1,106,0.2)] flex items-center justify-center gap-2 disabled:opacity-50 cursor-pointer">
      <span>{{ isSubmitting ? 'Đang xử lý...' : 'Xác nhận nạp tiền' }}</span>
      <span *ngIf="!isSubmitting" class="material-symbols-outlined text-xl">arrow_forward</span>
    </button>
  </div>
</div>
