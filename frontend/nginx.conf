server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser only talks to its own origin. The API container is not
    # published to the Internet, so no CORS configuration is needed here.
    location /api/ {
        proxy_pass http://finora-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Trusted bot ingestion endpoints live outside /api/v1. Forward them to
    # the backend too; otherwise Nginx would return the Angular application.
    location /public/ {
        proxy_pass http://finora-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
