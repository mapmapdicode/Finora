services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wealthos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_STATIC_TOKEN: dev-token
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/wealthos?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"


  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db_data:
  redis_data:
